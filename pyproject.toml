[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-captioning-vqa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "torch>=2.1,<3", "transformers>=4.40,<6", "gradio>=4,<7", "numpy>=1.24,<3", "sacrebleu>=2.4,<3", "rouge-score>=0.1.2,<1", "bert-score>=0.3.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
speech = ["faster-whisper>=1.1,<2", "edge-tts>=7,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["src"]
